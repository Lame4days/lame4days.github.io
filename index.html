<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lame4days Hub</title>
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0c;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Video/Animated Background Container */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25; /* Blends gaming video with dark theme */
            filter: blur(4px); /* Keeps text highly readable */
        }

        /* Profile Card */
        .profile-card {
            background: rgba(18, 18, 24, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #7289da; /* Glow accent color */
            box-shadow: 0 0 20px rgba(114, 137, 218, 0.4);
            margin-bottom: 1.2rem;
            object-fit: cover;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .bio {
            color: #b9bbbe;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Social Link Buttons */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-link i {
            font-size: 1.3rem;
            width: 25px;
        }

        /* Hover Glow Effects */
        .social-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(114, 137, 218, 0.2);
            border-color: rgba(114, 137, 218, 0.5);
        }
    </style>
</head>
<body>

    <!-- Background Layer (Neon loop for now) -->
    <div class="background-container">
        <video autoplay loop muted playsinline>
            <source src="https://mixkit.co" type="video/mp4">
        </video>
    </div>

    <!-- Main Content Box -->
    <div class="profile-card">
        <!-- Profile Picture -->
        <img src="https://github.com" alt="Avatar" class="avatar">
        
        <!-- Name & Bio -->
        <h1>Lame4days</h1>
        <p class="bio">GMOD Player & Content Creator</p>

        <!-- Social Buttons Grid -->
        <div class="links-container">
            <a href="https://youtube.com" target="_blank" class="social-link">
                <span><i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube</span>
                <i class="fas fa-chevron-right" style="font-size: 0.8rem; color: #555;"></i>
            </a>
            
            <a href="https://discord.com" target="_blank" class="social-link">
                <span><i class="fab fa-discord" style="color: #5865F2;"></i> Discord</span>
                <i class="fas fa-chevron-right" style="font-size: 0.8rem; color: #555;"></i>
            </a>

            <a href="https://steamcommunity.com" target="_blank" class="social-link">
                <span><i class="fab fa-steam" style="color: #00adee;"></i> Steam</span>
                <i class="fas fa-chevron-right" style="font-size: 0.8rem; color: #555;"></i>
            </a>
        </div>
    </div>

</body>
</html>
