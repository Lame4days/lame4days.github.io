<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lame4days</title>
    <!-- FontAwesome for Premium Social Elements -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #09090e;
            color: #f1f1f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Fluid Premium Gradient Mesh Background - Completely changes the vibe from guns.lol */
        .gradient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(91, 33, 182, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(29, 78, 216, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 1) 0%, rgba(5, 5, 10, 1) 100%);
        }

        /* Main Minimalist Workspace Frame */
        .dashboard-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(20, 20, 30, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            padding: 2.2rem;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profile Block Layout */
        .profile-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1.8rem;
            margin-bottom: 1.8rem;
        }

        /* Profile Image */
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 20px; /* Modern square-rounded finish instead of circle */
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #161622;
        }

        .meta-text {
            text-align: left;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 0.2rem;
        }

        .tagline {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 400;
        }

        /* App Grid Layout for Channels */
        .grid-headline {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        /* Clean Horizontal Grid Buttons */
        .app-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 1.2rem;
            height: 110px;
            color: #fff;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .app-card i {
            font-size: 1.6rem;
        }

        .app-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* Interactive Card States */
        .app-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        /* Subtle Individual Accent Branding Colors */
        .youtube-card:hover i { color: #ef4444; }
        .steam-card:hover i { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="gradient-bg"></div>

    <div class="dashboard-container">
        
        <!-- Header User Details Block -->
        <div class="profile-section">
            <img src="https://github.com" alt="lame4days Photo" class="avatar">
            <div class="meta-text">
                <h1>lame4days</h1>
                <p class="tagline">GMOD Enthusiast & Video Editor</p>
            </div>
        </div>

        <!-- Social Grid Structure Area -->
        <p class="grid-headline">Connected Platforms</p>
        <div class="apps-grid">
            
            <a href="https://youtube.com" target="_blank" class="app-card youtube-card">
                <i class="fab fa-youtube"></i>
                <span class="app-title">YouTube</span>
            </a>

            <a href="https://steamcommunity.com" target="_blank" class="app-card steam-card">
                <i class="fab fa-steam"></i>
                <span class="app-title">Steam</span>
            </a>

        </div>

    </div>

</body>
</html>
