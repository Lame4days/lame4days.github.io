<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lame4days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#0a0a12;
  --bg-2:#131326;
  --accent:#8b5cf6;
  --accent-2:#22d3ee;
  --accent-3:#fb7185;
  --text:#e7e7f3;
  --muted:#8b8ba3;
  --card:rgba(255,255,255,.04);
  --card-border:rgba(255,255,255,.08);
  --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--bg-1);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
#aurora{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
}
#aurora span{
  position:absolute;
  border-radius:50%;
  filter:blur(110px);
  opacity:.45;
  animation:drift 18s ease-in-out infinite;
}
#aurora span:nth-child(1){width:520px;height:520px;background:var(--accent);top:-140px;left:-120px}
#aurora span:nth-child(2){width:460px;height:460px;background:var(--accent-2);bottom:-160px;right:-120px;animation-delay:-6s}
#aurora span:nth-child(3){width:380px;height:380px;background:var(--accent-3);bottom:20%;left:55%;animation-delay:-11s;opacity:.25}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(60px,40px) scale(1.15)}
}
#grid{
  position:fixed;
  inset:0;
  z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 30%,transparent 75%);
}
#cursor{
  position:fixed;
  width:420px;height:420px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.14),transparent 65%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:-1;
  transition:left .18s linear,top .18s linear;
}
.card{
  width:100%;
  max-width:640px;
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  padding:56px 48px 40px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-2),var(--accent),var(--accent-3),transparent);
}
.avatar-wrap{
  width:128px;height:128px;
  margin:0 auto 24px;
  position:relative;
}
.avatar-wrap::before{
  content:"";
  position:absolute;inset:-4px;
  border-radius:50%;
  background:conic-gradient(from var(--spin,0deg),var(--accent),var(--accent-2),var(--accent-3),var(--accent));
  filter:blur(10px);
  opacity:.8;
  animation:spin 6s linear infinite;
}
@keyframes spin{to{--spin:360deg}}
@property --spin{syntax:"<angle>";initial-value:0deg;inherits:false}
.avatar{
  position:relative;
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #0a0a12;
}
h1{
  font-size:clamp(2rem,6vw,2.8rem);
  font-weight:700;
  letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--text),var(--accent-2));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:8px;
}
.tagline{
  color:var(--muted);
  font-size:1.05rem;
  margin-bottom:8px;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:.8rem;
  color:var(--muted);
  border:1px solid var(--card-border);
  background:rgba(255,255,255,.03);
  border-radius:999px;
  padding:6px 14px;
  margin-bottom:34px;
}
.badge .dot{
  width:8px;height:8px;
  border-radius:50%;
  background:#34d399;
  box-shadow:0 0 10px #34d399;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.4}}
.links{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:36px;
}
.link{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:var(--text);
  border:1px solid var(--card-border);
  background:rgba(255,255,255,.03);
  border-radius:14px;
  padding:16px 18px;
  transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;
  position:relative;
  overflow:hidden;
}
.link:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.2);
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.link svg{flex-shrink:0;width:22px;height:22px}
.link .l-name{font-weight:600;font-size:.98rem}
.link .l-handle{color:var(--muted);font-size:.8rem}
.link .arrow{
  margin-left:auto;
  color:var(--muted);
  font-size:1.1rem;
  transition:transform .2s;
}
.link:hover .arrow{transform:translateX(4px)}
@media(max-width:560px){.links{grid-template-columns:1fr}}
.glow-yt:hover{background:rgba(255,0,0,.08);border-color:rgba(255,0,0,.35)}
.glow-steam:hover{background:rgba(30,144,255,.08);border-color:rgba(30,144,255,.35)}
.term{
  text-align:left;
  border:1px solid var(--card-border);
  border-radius:14px;
  background:rgba(0,0,0,.35);
  overflow:hidden;
  margin-bottom:20px;
}
.term-bar{
  display:flex;align-items:center;
  gap:8px;padding:10px 14px;
  background:rgba(255,255,255,.04);
  border-bottom:1px solid var(--card-border);
}
.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term-bar .r{background:#ff5f57}.term-bar .y{background:#febc2e}.term-bar .g{background:#28c840}
.term-bar .t{
  margin-left:8px;font-size:.78rem;color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}
.term-body{
  padding:14px 16px;
  font-family:'JetBrains Mono',monospace;
  font-size:.8rem;
  line-height:1.75;
  color:#c9c9dd;
}
.term-body .k{color:var(--accent-2)}
.term-body .v{color:#e7e7f3}
.term-body .u{color:#34d399}
.term-body .d{color:var(--muted)}
.type{
  margin-top:10px;
  color:var(--muted);
}
.type span{color:var(--accent-2)}
.footer{margin-top:26px;color:var(--muted);font-size:.8rem}
.footer a{color:var(--muted)}
@media(max-width:560px){.card{padding:40px 22px 30px}}
</style>
</head>
<body>
<div id="aurora"><span></span><span></span><span></span></div>
<div id="grid"></div>
<div id="cursor"></div>

<div class="card">
  <div class="avatar-wrap">
    <img class="avatar" id="pfp" src="pfp.jpg" alt="profile picture">
  </div>

  <h1 id="name">lame4days</h1>
  <p class="tagline" id="tagline">content creator &amp; chaos enjoyer</p>
  <div class="badge"><span class="dot"></span><span id="status">status</span></div>

  <div class="links" id="links"></div>

  <div class="term">
    <div class="term-bar">
      <i class="r"></i><i class="y"></i><i class="g"></i>
      <span class="t" id="term-title">lame4days@arch</span>
    </div>
    <div class="term-body" id="term-body"></div>
  </div>

  <p class="type" id="type"></p>

  <p class="footer">made with <span style="color:var(--accent-3)">♥</span> · <a href="https://github.com" target="_blank" rel="noopener">github</a></p>
</div>

<script>
const SITE = {
  name: "lame4days",
  tagline: "content creator &amp; chaos enjoyer",
  status: "viewing the void",
  pfp: "https://yt3.googleusercontent.com/bhAX5hhQU1lh1sDW6vVusJDRV4zQwfkw_zRlC5FkiFjzXisXqbeA-AilYhVz87IJ4O0po1jlcA=s900-c-k-c0x00ffffff-no-rj",
  links: [
    { name: "YouTube", handle: "@lame4days", url: "https://www.youtube.com/@lame4days", cls: "yt", svg: '<svg viewBox="0 0 24 24" fill="#ff2727"><path d="M23.5 6.2a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.51A3.02 3.02 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3.02 3.02 0 0 0 2.12 2.14C4.5 20.45 12 20.45 12 20.45s7.5 0 9.38-.51a3.02 3.02 0 0 0 2.12-2.14A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8zM9.55 15.57V8.43L15.82 12z"/></svg>' },
    { name: "Steam", handle: "steamcommunity.com/id/lame4days", url: "https://steamcommunity.com/id/lame4days", cls: "steam", svg: '<svg viewBox="0 0 24 24" fill="#1b2838"><path d="M11.979 0C5.678 0 .512 4.86.023 11.037l6.432 2.658c.545-.371 1.202-.59 1.911-.59.064 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.634 0-3.015-1.173-3.33-2.727L.437 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12zm-6.76 13.6c.123.021.247.034.373.034.587 0 1.123-.235 1.527-.615l-1.455-.601c-.63-.262-.927-.98-.665-1.609.262-.63.979-.927 1.61-.663l1.455.601c-.019-.558.167-1.127.556-1.562.653-.723 1.807-.793 2.53-.14.656.593.699 1.657.347 2.483l-.792 1.253c.652.006 1.272.233 1.762.682.722.593.954 1.48.562 2.243l-5.38 3.137c-.564.329-1.291.136-1.62-.426-.153-.264-.182-.557-.106-.826-.93-.765-1.594-1.74-2.051-3.362zm6.246-7.106c-1.777 0-3.216 1.438-3.216 3.215s1.438 3.215 3.216 3.215 3.215-1.438 3.215-3.215-1.439-3.215-3.215-3.215zm0 1.175c1.13 0 2.039.909 2.039 2.04s-.909 2.04-2.039 2.04-2.039-.909-2.039-2.04.909-2.04 2.039-2.04z"/></svg>' }
  ],
  neofetch: [
    { k: "user",   v: "lame4days" },
    { k: "distro", v: "Arch Linux x86_64" },
    { k: "wm",     v: "Hyprland 0.54.3 (Wayland)" },
    { k: "term",   v: "kitty 0.46.2" },
    { k: "shell",  v: "fish 4.5.0" },
    { k: "cpu",    v: "AMD Ryzen 7 5700X @ 4.67 GHz" },
    { k: "gpu",    v: "NVIDIA GeForce RTX 5060" },
    { k: "games",  v: "Garry's Mod · CS:S · L4D2" }
  ],
  typewriter: [
    "neofetch",
    "sudo make me a sandwich",
    "pacman -S productivity --noconfirm",
    "4210 hours in gmod. help.",
    "welcome to my corner of the internet"
  ]
};

document.getElementById("name").innerHTML = SITE.name;
document.getElementById("tagline").innerHTML = SITE.tagline;
document.getElementById("status").innerHTML = SITE.status;
document.getElementById("pfp").src = SITE.pfp;

const links = document.getElementById("links");
SITE.links.forEach(l => {
  const a = document.createElement("a");
  a.href = l.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.className = "link glow-" + l.cls;
  a.innerHTML =
    l.svg +
    '<div class="l-info"><div class="l-name">' + l.name + '</div>' +
    '<div class="l-handle">' + l.handle + '</div></div>' +
    '<span class="arrow">→</span>';
  links.appendChild(a);
});

const body = document.getElementById("term-body");
SITE.neofetch.forEach(row => {
  const line = document.createElement("div");
  line.innerHTML = '  <span class="k">' + row.k + '</span> <span class="d">│</span> <span class="v">' + row.v + "</span>";
  body.appendChild(line);
});

const typeEl = document.getElementById("type");
let phrase = 0, char = 0, deleting = false;
function typeTick(){
  const txt = SITE.typewriter[phrase];
  typeEl.innerHTML =
    '<span style="color:var(--accent-2)">$</span> ' +
    txt.slice(0, char) + '<span style="color:var(--accent)">▍</span>';
  if(!deleting && char < txt.length){ char++; setTimeout(typeTick, 55); }
  else if(deleting && char > 0){ char--; setTimeout(typeTick, 28); }
  else{
    deleting = !deleting;
    if(!deleting) phrase = (phrase + 1) % SITE.typewriter.length;
    setTimeout(typeTick, deleting ? 1600 : 700);
  }
}
typeTick();

const cursor = document.getElementById("cursor");
addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});
</script>
</body>
</html>
